version: '3.9'
services:
  frontend:
    image: trading-formation-frontend:latest
    build:
      context: ..
      dockerfile: ./trading-formation/frontend/Dockerfile
    env_file:
      - ./frontend/.env
    ports:
      - '3000:3000'
    depends_on:
      - account-service
      - stock-screener
      - auth-service
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: trading_auth
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped

  auth-service:
    image: trading-formation-auth-service:latest
    build:
      context: ..
      dockerfile: ./trading-formation/backend/auth-service/Dockerfile
    env_file:
      - ./backend/auth-service/.env
    ports:
      - '9100:9100'
    depends_on:
      - postgres
    restart: unless-stopped

  account-service:
    image: trading-formation-account-service:latest
    build:
      context: ..
      dockerfile: ./trading-formation/backend/account-service/Dockerfile
    env_file:
      - ./backend/account-service/.env
    ports:
      - '9000:9000'
    restart: unless-stopped

  stock-screener:
    image: trading-formation-stock-screener:latest
    build:
      context: ..
      dockerfile: ./trading-formation/backend/stock-screener/Dockerfile
    env_file:
      - ./backend/stock-screener/.env
    ports:
      - '8080:8080'
    restart: unless-stopped

networks:
  default:
    driver: bridge

volumes:
  postgres-data:


