---
- name: Generate service env files from encrypted secrets
  hosts: localhost
  connection: local
  gather_facts: false

  vars_files:
    - vault.yml

  tasks:
    - name: Generate account-service .env
      template:
        src: account-service.env.j2
        dest: ../account-service/.env
        mode: '0600'

    - name: Generate stock-screener .env
      template:
        src: stock-screener.env.j2
        dest: ../stock-screener/.env
        mode: '0600'

    - name: Generate frontend .env
      template:
        src: frontend.env.j2
        dest: ../frontend/.env
        mode: '0600'
