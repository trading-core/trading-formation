---
- name: Generate service env files from encrypted secrets
  hosts: localhost
  connection: local
  gather_facts: false

  vars_files:
    - secrets.yml
    - services.yml
    - resources.yml
    - library.yml

  vars:
    makefile_targets: []

  tasks:
    - name: Generate account-service .env
      include_tasks: ../trading-backend/cmd/account-service/formation.yml
      tags:
        - account-service

    - name: Generate stock-screener .env
      include_tasks: ../trading-backend/cmd/stock-screener/formation.yml
      tags:
        - stock-screener

    - name: Generate authentication-service .env
      include_tasks: ../trading-backend/cmd/authentication-service/formation.yml
      tags:
        - authentication-service

    - name: Generate bot-service .env
      include_tasks: ../trading-backend/cmd/bot-service/formation.yml
      tags:
        - bot-service

    - name: Generate reporting-service .env
      include_tasks: ../trading-backend/cmd/reporting-service/formation.yml
      tags:
        - reporting-service

    - name: Generate storage-service .env
      include_tasks: ../trading-backend/cmd/storage-service/formation.yml
      tags:
        - storage-service

    - name: Generate journal-service .env
      include_tasks: ../trading-backend/cmd/journal-service/formation.yml
      tags:
        - journal-service

    - name: Generate frontend .env
      include_tasks: ../trading-frontend/formation.yml
      tags:
        - frontend

    - name: Render proxy Makefile
      template:
        src: templates/Makefile.j2
        dest: ../trading-backend/Makefile
        mode: '0644'
      tags:
        - makefile

    - name: Render docker-compose.yml
      template:
        src: templates/docker-compose.yml.j2
        dest: docker-compose.yml
        mode: '0644'
      tags:
        - compose

    - name: Ensure traefik-dynamic dir exists
      file:
        path: traefik-dynamic
        state: directory
        mode: '0755'
      tags:
        - traefik

    - name: Render Traefik static routes
      template:
        src: templates/traefik-static.yml.j2
        dest: traefik-dynamic/static.yml
        mode: '0644'
      tags:
        - traefik
