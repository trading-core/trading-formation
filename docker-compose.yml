services:
  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - redis-data:/data
    restart: unless-stopped

  frontend:
    image: trading-formation-frontend:latest
    build:
      context: ..
      dockerfile: ./trading-formation/frontend/Dockerfile
    env_file:
      - ./frontend/.env
    ports:
      - '3000:3000'
    depends_on:
      - account-service
      - stock-screener
      - authentication-service
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: trading_auth
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d trading_auth']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped

  authentication-service:
    image: trading-formation-authentication-service:latest
    build:
      context: ..
      dockerfile: ./trading-formation/backend/authentication-service/Dockerfile
    env_file:
      - ./backend/authentication-service/.env
    ports:
      - '9100:9100'
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  account-service:
    image: trading-formation-account-service:latest
    build:
      context: ..
      dockerfile: ./trading-formation/backend/account-service/Dockerfile
    env_file:
      - ./backend/account-service/.env
    ports:
      - '9000:9000'
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  stock-screener:
    image: trading-formation-stock-screener:latest
    build:
      context: ..
      dockerfile: ./trading-formation/backend/stock-screener/Dockerfile
    env_file:
      - ./backend/stock-screener/.env
    ports:
      - '8080:8080'
    restart: unless-stopped

networks:
  default:
    driver: bridge

volumes:
  postgres-data:
  redis-data:


