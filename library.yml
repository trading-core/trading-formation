---
secrets:
  token:
    TOKEN_SECRET: "{{ token_secret }}"
  broker_credentials:
    BROKER_CREDENTIALS_B64_JSON: "{{ broker_credentials_b64_json }}"
  alpaca:
    ALPACA_API_KEY: "{{ alpaca_api_key }}"
    ALPACA_API_SECRET: "{{ alpaca_api_secret }}"

apis:
  alpaca:
    ALPACA_API_SCHEME: https
    ALPACA_API_HOST: data.alpaca.markets
    ALPACA_API_PORT: "443"
  cnn_market_sentiment:
    FETCH_SENTIMENT_STRATEGY_IMPLEMENTATION: CNN_MARKET
    FETCH_SENTIMENT_STRATEGY_CNN_MARKET_ENDPOINT: https://production.dataviz.cnn.io/index/fearandgreed/graphdata
  trading_api:
    TRADING_API_SCHEME: http
    TRADING_API_HOST: "{{ domain }}"
  frontend:
    FRONTEND_BASE_URL: "http://{{ domain }}"

# In container mode siblings reach each other via the docker network
# (<container.host>:<container.port>) — direct, no proxy hop. In local/host mode
# they go through Traefik on :80 at http://<domain><path_prefix>.
clients:
  account_service:
    ACCOUNT_SERVICE_CLIENT_IMPLEMENTATION: HTTP
    ACCOUNT_SERVICE_SCHEME: "{{ services.account_service.scheme }}"
    ACCOUNT_SERVICE_HOST: "{{ services.account_service.container.host if mode == 'container' else domain }}"
    ACCOUNT_SERVICE_PORT: "{{ services.account_service.container.port if mode == 'container' else 80 }}"
  storage_service:
    STORAGE_SERVICE_CLIENT_IMPLEMENTATION: HTTP
    STORAGE_SERVICE_SCHEME: "{{ services.storage_service.scheme }}"
    STORAGE_SERVICE_HOST: "{{ services.storage_service.container.host if mode == 'container' else domain }}"
    STORAGE_SERVICE_PORT: "{{ services.storage_service.container.port if mode == 'container' else 80 }}"

# Browser-side URLs always go through Traefik on the single host.
public_clients:
  account_service:
    NEXT_PUBLIC_ACCOUNT_SERVICE_BASE_URL: "{{ services.account_service.scheme }}://{{ api_domain }}"
  stock_screener:
    NEXT_PUBLIC_STOCK_SCREENER_BASE_URL: "{{ services.stock_screener.scheme }}://{{ api_domain }}"
  authentication_service:
    NEXT_PUBLIC_AUTH_SERVICE_BASE_URL: "{{ services.authentication_service.scheme }}://{{ api_domain }}"
  bot_service:
    NEXT_PUBLIC_BOT_SERVICE_BASE_URL: "{{ services.bot_service.scheme }}://{{ api_domain }}"
  journal_service:
    NEXT_PUBLIC_JOURNAL_SERVICE_BASE_URL: "{{ services.journal_service.scheme }}://{{ api_domain }}"
  reporting_service:
    NEXT_PUBLIC_REPORTING_SERVICE_BASE_URL: "{{ services.reporting_service.scheme }}://{{ api_domain }}"

# Browser-side URLs for local dev — point to .localhost which resolves natively.
local_public_clients:
  account_service:
    NEXT_PUBLIC_ACCOUNT_SERVICE_BASE_URL: "{{ services.account_service.scheme }}://{{ local_api_domain }}"
  stock_screener:
    NEXT_PUBLIC_STOCK_SCREENER_BASE_URL: "{{ services.stock_screener.scheme }}://{{ local_api_domain }}"
  authentication_service:
    NEXT_PUBLIC_AUTH_SERVICE_BASE_URL: "{{ services.authentication_service.scheme }}://{{ local_api_domain }}"
  bot_service:
    NEXT_PUBLIC_BOT_SERVICE_BASE_URL: "{{ services.bot_service.scheme }}://{{ local_api_domain }}"
  journal_service:
    NEXT_PUBLIC_JOURNAL_SERVICE_BASE_URL: "{{ services.journal_service.scheme }}://{{ local_api_domain }}"
  reporting_service:
    NEXT_PUBLIC_REPORTING_SERVICE_BASE_URL: "{{ services.reporting_service.scheme }}://{{ local_api_domain }}"
