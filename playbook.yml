---
- name: Generate service env files from encrypted secrets
	hosts: localhost
	connection: local
	gather_facts: false

	vars_files:
		- secrets.yml

	tasks:
		- name: Generate account-service .env
			include_tasks: account-service/tasks.yml
			tags:
				- account-service

		- name: Generate stock-screener .env
			include_tasks: stock-screener/tasks.yml
			tags:
				- stock-screener

		- name: Generate frontend .env
			include_tasks: frontend/tasks.yml
			tags:
				- frontend
